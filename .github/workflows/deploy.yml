name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      # npm sometimes fails to detect glibc on the runner and then skips the
      # native Linux binaries of rollup (used by workbox via vite-plugin-pwa).
      - run: node -p "'glibc=' + process.report.getReport().header.glibcVersionRuntime"
      - run: npm ci
        env: { npm_config_libc: glibc }
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
