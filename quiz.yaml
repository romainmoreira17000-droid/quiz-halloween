# ============================================================
#  Paramètres du quiz d'Halloween
# ============================================================
# Ce fichier est vérifié automatiquement : si une règle n'est pas
# respectée, le site n'est pas publié et la liste des erreurs s'affiche.
# Pour vérifier soi-même : npm run valider
#
# Règles générales :
#  - une ligne = « clé: valeur » ; l'indentation (les espaces) compte ;
#  - mettre les textes entre guillemets s'ils contiennent « : » ou « # » ;
#  - toute clé inconnue (faute de frappe) est signalée.

# Titre affiché sur l'écran d'accueil. Obligatoire, texte non vide.
titre: "Le manoir hanté"

# Texte d'introduction sous le titre. Facultatif.
intro: "Des fantômes ont verrouillé la salle du restaurant hanté. Réussissez les épreuves pour trouver le code du cadenas !"

# Durée de la partie en minutes. Obligatoire, nombre entier supérieur à 0.
# Quand le temps est écoulé, le jeu continue (le compteur passe en rouge).
duree_minutes: 90

# Nombre d'étapes. Obligatoire, entier supérieur ou égal à 1.
# Doit être égal au nombre d'étapes listées sous « etapes ».
nombre_etapes: 6

# Message d'entrée, lu devant la porte du restaurant. Section facultative.
# Sa bonne réponse fait entrer les enfants dans la salle et démarre le compteur.
# Sans cette section, le compteur démarre dès « Commencer ».
#   titre         facultatif, texte non vide (par défaut : « Le message d'entrée »)
#   message       obligatoire, texte non vide ; « | » permet d'écrire sur plusieurs lignes
#   type_reponse  obligatoire : chiffres (pavé numérique) ou mots (clavier de lettres)
#   reponse       obligatoire, ce que les enfants doivent taper (voir les règles plus bas)
entree:
  titre: "Une lettre sous la porte"
  message: |
    Chers visiteurs,
    le fantôme du chef a verrouillé son restaurant.
    Qui suis-je ? Je traverse les murs et je fais « Bouh ! ».
  type_reponse: mots
  reponse: "Fantôme"

# Liste des étapes (une étape = une épreuve), dans l'ordre où les enfants les jouent.
# Chaque étape commence par « - » et contient :
#   titre         obligatoire, texte non vide
#   consigne      obligatoire, texte non vide (ce que les enfants doivent faire)
#   image         facultatif, nom d'un fichier placé dans public/images/
#   type_reponse  obligatoire : chiffres ou mots
#   reponse       obligatoire, la bonne réponse de l'épreuve :
#                   - chiffres : uniquement des chiffres, 12 au plus ; les guillemets sont
#                     facultatifs, un 0 au début est gardé avec ou sans eux (0472 ou "0472")
#                   - mots : lettres, espaces, apostrophes ou tirets, 24 caractères au plus ;
#                     majuscules et accents ne comptent pas
#   chiffre       obligatoire, le chiffre (0 à 9) gagné pour le cadenas final
etapes:
  - titre: "La crypte"
    consigne: "Comptez toutes les chauves-souris en papier cachées dans la salle."
    type_reponse: chiffres
    reponse: "13"
    chiffre: 4

  - titre: "Le chaudron"
    consigne: "Goûtez la potion les yeux bandés. Quel animal la sorcière a-t-elle mis dedans ?"
    type_reponse: mots
    reponse: "Crapaud"
    chiffre: 7

  - titre: "La bibliothèque"
    consigne: "Le code du coffre à livres est écrit à l'envers sur le miroir."
    type_reponse: chiffres
    reponse: "0472"
    chiffre: 2

  - titre: "Le cimetière"
    consigne: "Additionnez les années gravées sur les trois tombes à citrouille."
    type_reponse: chiffres
    reponse: "1832"
    chiffre: 9

  - titre: "Le grenier"
    consigne: "Qu'a tissé l'araignée géante au-dessus de la malle ?"
    type_reponse: mots
    reponse: "Toile d'araignée"
    chiffre: 0

  - titre: "La porte de la cuisine"
    consigne: "Quel légume orange le chef creuse-t-il pour Halloween ?"
    type_reponse: mots
    reponse: "Citrouille"
    chiffre: 5

# Cadenas final. Section entière facultative.
cadenas:
  # Ordre dans lequel les chiffres des étapes forment le code.
  # Facultatif (par défaut : 1, 2, 3...). S'il est donné, il doit contenir
  # chaque numéro d'étape de 1 à nombre_etapes, une seule fois.
  # Ici : chiffre de l'étape 3, puis de l'étape 1, puis 6, 2, 5 et 4.
  ordre: [3, 1, 6, 2, 5, 4]

  # Indice affiché près du cadenas. Facultatif, texte.
  indice: "Commencez par les livres, finissez sous les tombes."

  # Titre de l'écran du cadenas. Facultatif, texte non vide
  # (par défaut : « Le cadenas »).
  titre: "La porte du restaurant hanté"

  # Message affiché quand le cadenas s'ouvre. Facultatif, texte non vide
  # (par défaut : « Le cadenas est ouvert ! »).
  message_victoire: "La salle du restaurant hanté est ouverte !"
