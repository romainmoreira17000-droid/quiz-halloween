# ============================================================
#  Paramètres du quiz d'Halloween
# ============================================================
# Ce fichier est vérifié automatiquement : si une règle n'est pas
# respectée, le site n'est pas publié et la liste des erreurs s'affiche.
# Pour vérifier soi-même : npm run valider
#
# Règles générales :
#  - une ligne = « clé: valeur » ; l'indentation (les espaces) compte ;
#  - mettre les textes entre guillemets s'ils contiennent « : » ou « # » ;
#  - toute clé inconnue (faute de frappe) est signalée.

# Titre affiché sur l'écran d'accueil. Obligatoire, texte non vide.
titre: "Le restaurant des ombres"

# Fond d'écran de l'accueil et de l'attente entre deux salles. Facultatif : nom d'un
# fichier placé dans public/images/ (sans fond : décor sombre à l'accueil, grande salle
# dessinée pendant l'attente). Pour ajouter une illustration : déposer le PNG dans
# images-sources/ puis lancer « npm run images », qui crée le fichier .webp léger.
fond_accueil: "image-principale.webp"

# Message animé affiché quand une équipe a trouvé son chiffre avant la fin du créneau,
# en attendant le changement d'épreuve. Le même dans toutes les salles. Facultatif
# (sans lui, pas de message), texte non vide.
message_attente: "Profitez-en pour déguster ce qui se trouve sur la table !"

# Texte d'introduction sous le titre. Facultatif.
intro: "Bienvenue au restaurant des ombres ! Pour en sortir, résolvez les 6 épreuves : chacune vous donne un chiffre du code qui ouvre le cadenas de la porte."

# Noms des équipes, dans l'ordre de rotation. Obligatoire.
# Au moins une équipe par épreuve en rotation (les étapes sauf la finale) : chaque équipe
# fait toutes les épreuves en commençant par une épreuve différente (la 1re équipe par
# l'épreuve 1, la 2e par l'épreuve 2...). Avec plus d'équipes que d'épreuves en rotation,
# certaines partageraient un poste : ici 5 équipes pour 5 épreuves, chacune seule dans sa salle.
# Noms non vides et tous différents.
# Un animateur choisit l'équipe de chaque tablette avant la soirée.
equipes: ["Sorcières", "Zombies", "Fantômes", "Loups-garous", "Squelettes"]

# Durée d'une épreuve, en minutes. Obligatoire, nombre entier supérieur à 0.
# Toutes les équipes changent de salle en même temps. Durée totale de la partie :
# nombre_etapes × duree_epreuve_minutes.
duree_epreuve_minutes: 15

# Minutes après le début de chaque épreuve où s'active chaque indice : le 1er à 8 min,
# le 2e à 10 min… Obligatoire, nombres entiers en croissant, plus petits que
# duree_epreuve_minutes. Une épreuve a au plus autant d'indices que d'horaires.
indices_apres_minutes: [8, 10, 13]

# Après une mauvaise réponse à une épreuve, la saisie est bloquée pendant ce nombre de
# secondes : les enfants doivent chercher au lieu de tenter au hasard. Obligatoire,
# nombre entier, 0 ou plus (0 = pas de blocage). Le blocage s'arrête toujours au
# changement de salle.
blocage_secondes: 60

# Code animateur : sert à régler l'équipe d'une tablette et à donner le chiffre d'une
# épreuve pas trouvée à temps. Obligatoire, de 4 à 8 chiffres. Ne jamais le dire devant
# les enfants. Attention : ce fichier est public, comme les réponses.
code_animateur: "2710"

# Nombre d'étapes. Obligatoire, entier supérieur ou égal à 1.
# Doit être égal au nombre d'étapes listées sous « etapes ».
nombre_etapes: 6

# Message d'entrée, lu devant la porte du restaurant. Section facultative, absente ici :
# le soir d'Halloween, le code d'entrée est sur papier. Si on l'ajoute, sa bonne réponse
# fait entrer les enfants dans la salle et démarre les chronos.
#   titre         facultatif, texte non vide (par défaut : « Le message d'entrée »)
#   message       obligatoire, texte non vide ; « | » permet d'écrire sur plusieurs lignes
#   type_reponse  obligatoire : chiffres (pavé numérique) ou mots (clavier de lettres)
#   reponse       obligatoire, ce que les enfants doivent taper (voir les règles plus bas)
# Exemple :
# entree:
#   message: "Qui suis-je ? Je traverse les murs."
#   type_reponse: mots
#   reponse: "Fantôme"

# Liste des étapes (une étape = une épreuve), numérotées dans l'ordre (la 1re est l'épreuve
# 1) ; chaque équipe les joue dans son ordre de rotation.
# Chaque étape commence par « - » et contient :
#   titre         obligatoire, texte non vide
#   consigne      obligatoire, texte non vide (ce que les enfants doivent faire)
#   image         facultatif, nom d'un fichier placé dans public/images/
#   fond          facultatif, fond d'écran de la salle (fichier .webp de public/images/,
#                 voir « fond_accueil ») ; sans fond : la grande salle dessinée
#   type_reponse  obligatoire : chiffres ou mots
#   reponse       obligatoire, la bonne réponse de l'épreuve :
#                   - chiffres : uniquement des chiffres, 12 au plus ; les guillemets sont
#                     facultatifs, un 0 au début est gardé avec ou sans eux (0472 ou "0472")
#                   - mots : lettres, espaces, apostrophes ou tirets, 24 caractères au plus ;
#                     majuscules et accents ne comptent pas
#   chiffre       obligatoire, le chiffre (0 à 9) gagné pour le cadenas final
#   indices       facultatif, liste de textes non vides : les indices que les enfants débloquent
#                 un par un aux minutes de « indices_apres_minutes » ; sans indices, pas de
#                 bouton « Indice »
#   finale        facultatif, true sur une seule étape : l'épreuve que toutes les équipes
#                 jouent ensemble au dernier créneau, après la rotation des autres ; ses
#                 indices arrivent aux mêmes minutes que les autres. Sa bonne réponse ouvre le cadenas.
etapes:
  - titre: "La galerie des portraits"
    fond: "galerie-des-portraits.webp"
    consigne: "Les tableaux couvrent les murs. Certains personnages semblent immobiles… d'autres vous suivent des yeux. Comptez les yeux mobiles qui vous regardent : ce nombre est le chiffre caché par la galerie."
    type_reponse: chiffres
    reponse: "6"
    chiffre: 6
    indices:
      - "La réponse est un nombre pair."
      - "Pensez à votre équipe… moins le chef, il reste la moitié du groupe."
      - "Calculez : 104 ÷ 4 − 20."

  # Salle de la table hantée : les codes sont cachés sous les assiettes et sous les chaises.
  - titre: "L'addition"
    fond: "table-hantee.webp"
    consigne: "Installez-vous à votre place au buffet. Pour payer l'addition, ne vous préoccupez pas du dessus de la table : regardez plutôt dessous. Tapez le chiffre trouvé."
    type_reponse: chiffres
    reponse: "3"
    chiffre: 3
    indices:
      - "Mettez en lumière les assiettes."
      - "Les chaises peuvent parler."
      - "Faites concorder la vaisselle et les chaises, puis remettez tout dans le bon ordre."

  # Le cadenas physique du cercueil s'ouvre avec 2806 (date cachée, 28/06) ; dans
  # l'app, les enfants tapent le chiffre trouvé dans le cercueil.
  - titre: "Le cimetière"
    fond: "cimetiere.webp"
    consigne: "Le fantôme de Palissy a emporté un chiffre du code. Trouvez la date de sa mort : elle ouvre le cadenas du cercueil. Mais elle n'apparaît pas à la lumière ordinaire… Tapez le chiffre caché dans le cercueil."
    type_reponse: chiffres
    reponse: "8"
    chiffre: 8
    indices:
      - "La réponse est sur le cercueil, mais tout dépend de la couleur de l'éclairage."
      - "Il faut utiliser la lampe à lumière noire."
      - "La raison de sa mort vous donnera la réponse."

  # Salle des saveurs hantées. Solution : 7 − 5 + 7 = 9.
  - titre: "Le jackpot funèbre"
    fond: "saveurs-hantees.webp"
    consigne: "Rendez-vous devant la machine « à sous » cis. Devant chaque vitrail, accrochez bien votre trippe « Aïe ». Gare au remue-ménage : remue-méninges garanti, et l'opération sera savoureuse !"
    type_reponse: chiffres
    reponse: "9"
    chiffre: 9
    indices:
      - "Les mathématiques sont systématiques."
      - "Chaque souci a son symbole."
      - "Ouvrez les yeux, et réapprenez vos calculs mentaux."

  # Salle des toilettes scientifiques. Doses derrière les scientifiques :
  # 1 orange + 2 jaunes + 2 rouges + 3 verts + 1 bleu = 9.
  - titre: "Les toilettes scientifiques"
    fond: "toilettes-scientifiques.webp"
    consigne: "Si vous ne voulez pas mourir asphyxiés, ne restez pas trop longtemps sur le trône. Soyez observateurs : derrière chaque scientifique se trouve le bon dosage. Tapez le chiffre trouvé."
    type_reponse: chiffres
    reponse: "9"
    chiffre: 9
    indices:
      - "Soyez attentifs aux chiffres colorés."
      - "Pour les doses, faites la correspondance entre couleur et numéro."
      - "La solution sera l'addition des doses."

  # Épreuve finale : tout le monde la joue ensemble au 6e créneau. Six des hôtes portent
  # une étiquette avec un code et une lettre : Q-U-A-T-R-E.
  - titre: "Invisible mais visible"
    finale: true
    fond: "invisible-mais-visible.webp"
    consigne: "Dirigez-vous vers vos ennemis… qui deviendront peut-être vos amis. Tapez le chiffre trouvé."
    type_reponse: chiffres
    reponse: "4"
    chiffre: 4
    indices:
      - "Six de vos hôtes ont un petit truc en plus."
      - "Les indices sont codés à gauche ou à droite."
      - "Pour trouver le dernier chiffre, il vous faudra jouer aux chiffres et aux lettres."

# Cadenas final. Section entière facultative.
cadenas:
  # Ordre dans lequel les chiffres des étapes forment le code.
  # Facultatif (par défaut : 1, 2, 3...). S'il est donné, il doit contenir
  # chaque numéro d'étape de 1 à nombre_etapes, une seule fois.
  # Ici, l'ordre du déroulé de la soirée : cimetière (3), galerie (1), toilettes
  # scientifiques (5), addition (2), jackpot (4), invisible mais visible (6) → code 8 6 9 3 9 4.
  ordre: [3, 1, 5, 2, 4, 6]

  # Indice affiché près du cadenas. Facultatif, texte. Les retours à la ligne
  # sont gardés à l'écran (« |- » en YAML). La comptine donne l'ordre des salles.
  indice: |-
    D'abord chez les morts qui dorment sous la terre,
    puis face aux portraits qui vous suivent des yeux ;
    aux toilettes ensuite, l'addition, le jackpot d'enfer,
    et ce qu'on ne voit pas vient fermer le jeu.

  # Fond d'écran du cadenas et de la victoire. Facultatif (voir « fond_accueil »).
  fond: "sortie-du-restaurant.webp"

  # Titre de l'écran du cadenas. Facultatif, texte non vide
  # (par défaut : « Le cadenas »).
  titre: "La porte du restaurant des ombres"

  # Message affiché quand le cadenas s'ouvre. Facultatif, texte non vide
  # (par défaut : « Le cadenas est ouvert ! »).
  message_victoire: "Bravo ! Vous avez déchiffré toutes les épreuves du restaurant des ombres. Les fantômes s'inclinent, la porte s'ouvre… et le festin vous attend !"
